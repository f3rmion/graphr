name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  checks:
    name: Required checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is not optional cover. Snapshot publication reaches the
        # filesystem through pinned directory descriptors, and the primitives
        # differ per platform, so a Linux-only workflow can report green while
        # the published binary cannot index on macOS at all. Both jobs are
        # required.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      # rust-toolchain.toml pins the channel and the clippy/rustfmt components,
      # so the toolchain is installed from the repository rather than the runner
      # default and CI cannot drift from a local build.
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy --all-targets -- -D warnings
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      - name: cargo build --locked --release
        run: cargo build --locked --release
