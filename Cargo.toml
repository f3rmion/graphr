[package]
name = "graphr"
version = "0.6.0"
edition = "2024"
rust-version = "1.97.1"
description = "Fast, compact Rust and Python code graphs for AI code review over MCP stdio"
license = "MIT"
repository = "https://github.com/f3rmion/graphr"
readme = "README.md"
keywords = ["mcp", "code-review", "code-graph", "rust", "python"]
categories = ["development-tools"]
exclude = ["/.agents", "/AGENTS.md"]

[dependencies]
blake3 = "1.8.5"
libc = "0.2.189"
rmcp = { version = "=3.1.0", default-features = false, features = ["server", "macros", "transport-io"] }
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["macros", "rt", "sync"] }
tree-sitter = "0.26.11"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
